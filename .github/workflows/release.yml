name: release
on:
  schedule: [{ cron: "0 7 * * *" }]
  workflow_dispatch:
    inputs:
      engine_ref: { description: "Engine commit (empty: upstream main)", required: false }
      uidata_ref: { description: "UI data commit (empty: upstream master)", required: false }
      att_ref: { description: "AllTheThings commit (empty: newest that changed the Forever database)", required: false }
permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  # Picks the commits, runs the gate (every build sims with its defaults) and builds the data bundle.
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.4" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Pick the engine, UI data and item source commits
        run: |
          ENGINE="${{ inputs.engine_ref }}"; UIDATA="${{ inputs.uidata_ref }}"; ATT="${{ inputs.att_ref }}"
          [ -z "$ENGINE" ] && ENGINE=$(git ls-remote https://github.com/sage3648/mythicsim-forever-engine.git refs/heads/main | cut -f1)
          [ -z "$UIDATA" ] && UIDATA=$(git ls-remote https://github.com/wowsims/forever.git refs/heads/master | cut -f1)
          [ -z "$ATT" ] && ATT=$(gh api "repos/ATTWoWAddon/AllTheThings/commits?path=.contrib/.db/forever&per_page=1" --jq '.[0].sha')
          echo "$ENGINE" > ENGINE_REF; echo "$UIDATA" > UIDATA_REF; echo "$ATT" > ATT_REF
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Skip when these commits are already released
        id: tag
        run: |
          KEY="$(cut -c1-7 ENGINE_REF)$(cut -c1-7 UIDATA_REF)$(cut -c1-7 ATT_REF)"
          echo "tag=forever-$(date -u +%Y%m%d)-$KEY" >> "$GITHUB_OUTPUT"
          if gh release list --limit 50 | grep -q -- "-$KEY"; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
        env: { GH_TOKEN: "${{ github.token }}" }
      - if: steps.tag.outputs.skip != '1'
        run: bash scripts/sync-engine.sh && bash scripts/fetch-wago.sh
      - if: steps.tag.outputs.skip != '1'
        uses: Swatinem/rust-cache@v2
      - if: steps.tag.outputs.skip != '1'
        run: go test ./cmd/... && cargo test
      - if: steps.tag.outputs.skip != '1'
        run: go run ./cmd/gendata -commit "$(cut -c1-7 ENGINE_REF)"
      - if: steps.tag.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: gate
          path: |
            ENGINE_REF
            UIDATA_REF
            ATT_REF
            wago/BUILD
            dist/data
  build:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: simhammer-forever-windows-x64.zip }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: simhammer-forever-linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: simhammer-forever-linux-arm64.tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: simhammer-forever-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: simhammer-forever-macos-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: gate }
      - run: bash scripts/sync-engine.sh
        shell: bash
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
        env: { SIMHAMMER_FOREVER_VERSION: "${{ needs.gate.outputs.tag }}" }
      - run: bash scripts/package.sh ${{ matrix.target }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.asset }}", path: "dist/${{ matrix.asset }}" }
  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          cp artifacts/gate/ENGINE_REF artifacts/gate/UIDATA_REF artifacts/gate/ATT_REF .
          gh release create "${{ needs.gate.outputs.tag }}" artifacts/simhammer-forever-*/* \
            --title "${{ needs.gate.outputs.tag }}" \
            --notes "Engine sage3648/mythicsim-forever-engine@$(cat ENGINE_REF), UI data wowsims/forever@$(cat UIDATA_REF), item sources ATTWoWAddon/AllTheThings@$(cat ATT_REF), client build $(cat artifacts/gate/wago/BUILD)"
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add ENGINE_REF UIDATA_REF ATT_REF && git commit -m "chore: engine $(cut -c1-7 ENGINE_REF), ui data $(cut -c1-7 UIDATA_REF), item sources $(cut -c1-7 ATT_REF)" && git push || true
        env: { GH_TOKEN: "${{ github.token }}" }
